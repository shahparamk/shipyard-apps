server {
    listen 8080;
    server_name _;
    server_tokens off; # don't advertise the nginx version

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (no add_header in the locations below, so these always apply)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Probe endpoint for Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Built assets have content hashes in their names, so they can be cached forever
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths fall back to index.html; never cache it
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}